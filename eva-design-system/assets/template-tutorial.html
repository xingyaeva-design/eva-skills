<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- 页面标题 --></title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 修复：Cormorant Garamond（英文）+ Noto Serif SC（中文），去掉 Fraunces/Caveat/Noto Sans SC -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* === CSS变量 — Eva Design System === */
    :root {
      --bg:         #F5F4F0;
      --bg-deep:    #E8E6E0;
      --bg-deeper:  #DDDAD3;
      --bg-dark:    #2C2C28;
      --green:      #8A9E92;
      --green-deep: #5E7A6A;
      --gold:       #C4A882;
      --sand:       #BEB5A2;
      --ink:        #2E2820;
      --ink-mid:    #4e4840;
      --ink-light:  #A09688;
      --font-en:    'Cormorant Garamond', Georgia, serif;
      --font-cn:    'Noto Serif SC', 'Songti SC', 'SimSun', serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 修复：正文改衬线，font-weight 300 */
    body {
      font-family: var(--font-cn);
      font-size: 16px;
      line-height: 1.7;
      font-weight: 300;
      color: var(--ink);
      background: var(--bg);
    }

    /* 修复：selection 换成 brand-dna 规定值 */
    ::selection { background: #C8D4CA; color: #2E2820; }

    /* skip link 无障碍 */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 1rem;
      background: var(--ink);
      color: var(--bg);
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      z-index: 9999;
    }
    .skip-link:focus { top: 1rem; }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 clamp(40px, 8vw, 120px);
    }

    /* === Hero — 两栏布局 === */
    /* 修复：100vh → 100dvh */
    .hero {
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1fr 0.55fr;
      align-items: center;
      gap: clamp(40px, 6vw, 80px);
      padding: clamp(80px, 12vh, 160px) clamp(40px, 8vw, 120px);
      max-width: 1280px;
      margin: 0 auto;
    }

    .label-caps {
      font-family: var(--font-cn);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 400;
      color: var(--green);
      display: block;
      margin-bottom: 1rem;
    }

    /* 修复：英文字体 Cormorant，字重 600 */
    .hero h1 {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    .hero h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--ink-mid);
    }

    .hero p {
      font-size: 1rem;
      color: var(--ink-mid);
      max-width: 520px;
      line-height: 1.8;
    }

    .hero-visual {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    /* === Content Sections === */
    .section { padding: clamp(80px, 12vh, 160px) 0; }
    .section--alt { background: var(--bg-deep); }
    .section--dark {
      background: var(--bg-dark);
      color: #F0EDE6;
    }

    .section-header { margin-bottom: clamp(40px, 6vw, 80px); }

    /* 修复：section-number 用 Cormorant italic + 暖金 */
    .section-number {
      font-family: var(--font-en);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.4rem, 3vw, 2rem);
      color: var(--gold);
      opacity: 0.6;
      display: block;
      margin-bottom: 0.25rem;
    }

    .section-title {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: clamp(1.5rem, 3.5vw, 2.4rem);
      color: var(--ink);
    }

    .section--dark .section-title { color: #F0EDE6; }

    /* 装饰分隔线 */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--sand);
      margin: 1.5rem 0;
    }

    /* === 卡片 === */
    /* 修复：圆角减小，边框改烟绿/暖金，去掉 box-shadow hover，改 opacity */
    .feature-card {
      background: var(--bg);
      border-radius: 4px;
      padding: clamp(24px, 3vw, 40px);
      border-left: 2px solid var(--green);
      transition: opacity 0.2s ease;
    }

    /* 方法论/步骤类用暖金边框 */
    .feature-card--gold { border-left-color: var(--gold); }

    .feature-card:hover { opacity: 0.8; }

    .feature-card .card-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--green);
      margin-bottom: 0.75rem;
      display: block;
    }

    .feature-card h3 {
      font-family: var(--font-en);
      font-weight: 600;
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .feature-card p {
      font-size: 0.9rem;
      color: var(--ink-mid);
      line-height: 1.7;
    }

    /* 编号大字叠底 */
    .step-number {
      font-family: var(--font-en);
      font-size: clamp(3rem, 8vw, 7rem);
      font-weight: 300;
      color: var(--sand);
      opacity: 0.12;
      line-height: 1;
      margin-bottom: -1rem;
      display: block;
    }

    /* 深色 section 内文字 */
    .section--dark .section-number { color: var(--gold); opacity: 0.7; }
    .section--dark p { color: rgba(240,237,230,0.7); }

    /* === Footer === */
    footer {
      padding: clamp(40px, 6vh, 80px) 0;
      border-top: 0.5px solid var(--bg-deeper);
    }

    footer p {
      font-size: 0.78rem;
      color: var(--ink-light);
      letter-spacing: 0.04em;
    }

    /* === Scroll Reveal === */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }
    .reveal-d1 { transition-delay: 0.1s; }
    .reveal-d2 { transition-delay: 0.2s; }
    .reveal-d3 { transition-delay: 0.3s; }
    .reveal-d4 { transition-delay: 0.4s; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* === 响应式 === */
    @media (max-width: 900px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: auto;
        padding: 5rem 1.5rem 3rem;
      }
      .hero-visual { display: none; }
    }

    @media (max-width: 768px) {
      .feature-card { padding: 1.5rem; }
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
    }
  </style>
</head>
<body>

  <a class="skip-link" href="#main">跳至主要内容</a>

  <!-- ====== HERO — 两栏布局 ====== -->
  <section class="hero" id="main">
    <div class="hero-text">
      <span class="label-caps"><!-- 分类标签 --></span>
      <h1><!-- 主标题，英文可加 <em>斜体</em> --></h1>
      <div class="divider"></div>
      <p><!-- 副标题 / 一句话描述 --></p>
    </div>
    <div class="hero-visual">
      <!-- 视觉元素：图片 / 装饰 / IP形象 -->
    </div>
  </section>

  <!-- ====== SECTION 1 — 选不同于Hero的布局（如卡片网格/步骤流程） ====== -->
  <section class="section section--alt">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">01</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 — 从 components.md 选组件 -->
        <div class="feature-card">
          <span class="step-number">01</span>
          <span class="card-label"><!-- 标签 --></span>
          <h3><!-- 卡片标题 --></h3>
          <p><!-- 卡片描述 --></p>
        </div>
      </div>
    </div>
  </section>

  <!-- ====== SECTION 2 — 换另一种布局 ====== -->
  <section class="section">
    <div class="container">
      <div class="section-header reveal">
        <span class="section-number">02</span>
        <h2 class="section-title"><!-- Section标题 --></h2>
      </div>
      <div class="reveal reveal-d1">
        <!-- Section内容 -->
      </div>
    </div>
  </section>

  <!-- ====== SECTION 3 — 深色打破节奏（可选，≤30%） ====== -->
  <section class="section section--dark">
    <div class="container">
      <div class="reveal">
        <span class="section-number">03</span>
        <h2 class="section-title"><!-- 重点内容 / 引用 --></h2>
        <div class="divider" style="background: rgba(190,181,162,0.3); margin-top: 1.5rem;"></div>
        <p style="margin-top: 1.5rem; font-family: var(--font-en); font-style: italic; font-size: clamp(1.1rem, 2vw, 1.5rem);">
          <!-- 金句 / 核心观点 -->
        </p>
      </div>
    </div>
  </section>

  <!-- ====== FOOTER ====== -->
  <footer>
    <div class="container">
      <p><!-- 底部信息 / 署名 --></p>
    </div>
  </footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>
</body>
</html>
